name: 'Calculate Versions'
description: 'Calculate semantic versions for projects using Mister.Version'
author: 'Mister.Version Team'

branding:
  icon: 'calculator'
  color: 'green'

inputs:
  projects:
    description: 'Glob patterns or project file paths to version, separated by commas and/or newlines (e.g. "src/**/*.csproj" or "src/A/A.csproj, src/B/B.csproj"). Relative patterns are resolved against repository-path; prefix with ! to exclude. The step fails when nothing matches.'
    required: false
    default: '**/*.csproj'
  repository-path:
    description: 'Path to the Git repository root (project patterns are relative to it; project files outside it are ignored)'
    required: false
    default: '.'
  prerelease-type:
    description: 'Prerelease type for main/dev branches (none, alpha, beta, rc)'
    required: false
    default: 'none'
  tag-prefix:
    description: 'Prefix for version tags'
    required: false
    default: 'v'
  force-version:
    description: 'Force a specific version for all projects'
    required: false
  dependencies:
    description: 'Deprecated and ignored: mr-version tracks ProjectReference dependencies (direct and transitive) automatically; use projects.<name>.additionalMonitorPaths in mr-version.yml for other paths'
    required: false
    deprecationMessage: 'The dependencies input is ignored; mr-version detects project dependencies automatically. Use projects.<name>.additionalMonitorPaths in mr-version.yml for other paths.'
  output-format:
    description: 'Output format (json, yaml, text)'
    required: false
    default: 'json'
  fail-on-no-changes:
    description: 'Fail the action if no projects have version changes'
    required: false
    default: 'false'
  update-project-properties:
    description: 'Update version properties in project files'
    required: false
    default: 'false'
  write-mrversion-props:
    description: 'Write MrVersion.props file in each project directory'
    required: false
    default: 'false'
  config-file:
    description: 'Path to mr-version.yml configuration file (auto-detected if not specified)'
    required: false
  dry-run:
    description: 'Calculate versions but do not modify project files (skips update-project-properties and write-mrversion-props)'
    required: false
    default: 'false'
  output-version-information:
    description: 'Display the version information output as part of the job summary.'
    required: false
    default: 'false'
  include-test-projects:
    description: 'Include test projects in the version calculation results'
    required: false
    default: 'false'
  allow-shallow:
    description: 'Calculate versions even if the repository is a shallow clone. By default a shallow clone fails the step, because missing history and tags make every project fall back to its base version (use actions/checkout with fetch-depth: 0)'
    required: false
    default: 'false'

outputs:
  projects:
    description: 'JSON array of project version information'
  changed-projects:
    description: 'JSON array of projects with version changes'
  has-changes:
    description: 'Whether any projects have version changes'
  projects-count:
    description: 'Number of projects in the projects output'
  changed-count:
    description: 'Number of projects in the changed-projects output'
  summary:
    description: 'Human-readable summary of version calculations'
  version-map:
    description: 'JSON map of project names/paths to their calculated versions'
  version:
    description: 'The calculated version of the first changed project, or of the first project when none changed'
  version-project:
    description: 'Name of the project the version, major, minor, patch and prerelease outputs come from'
  major:
    description: 'Major version number of the version output'
  minor:
    description: 'Minor version number of the version output'
  patch:
    description: 'Patch version number of the version output'
  prerelease:
    description: 'Prerelease label of the version output, verbatim (e.g. "rc.1" or "new-widget.2"; empty for a release version)'
  has-validation-errors:
    description: 'Whether any projects have validation errors'
  has-validation-warnings:
    description: 'Whether any projects have validation warnings'
  validation-errors-count:
    description: 'Number of projects with validation errors'
  validation-warnings-count:
    description: 'Number of projects with validation warnings'

runs:
  using: 'node24'
  main: 'dist/index.js'